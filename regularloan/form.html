<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Queue — MAGCOOP</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif;}
        body {background:linear-gradient(135deg, #003399, #004de6); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
        .card {background:white; border-radius:12px; padding:30px 25px; width:100%; max-width:420px; box-shadow:0 4px 20px rgba(0,0,0,0.2);}
        .logo {text-align:center; margin-bottom:25px;}
        .logo-text {font-size:32px; font-weight:900;}
        .mag {color:#003399;} .coop {color:#ffcc00;}
        h2 {text-align:center; color:#333; margin-bottom:20px; font-size:20px;}
        label {display:block; margin-bottom:8px; font-weight:bold; color:#444;}
        input {width:100%; padding:14px; font-size:18px; border:2px solid #ddd; border-radius:6px; margin-bottom:20px;}
        input:focus {outline:none; border-color:#003399;}
        button {width:100%; padding:15px; font-size:18px; font-weight:bold; background:#003399; color:white; border:none; border-radius:6px; cursor:pointer;}
        button:hover {background:#002266;}
        .success {display:none; text-align:center; padding:20px 10px;}
        .success h3 {color:#28a745; margin-bottom:10px;}
        .status {margin-top:10px; font-size:13px; color:#666; text-align:center;}
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <h1 class="logo-text"><span class="mag">MAG</span><span class="coop">COOP</span></h1>
        </div>

        <div id="form-view">
            <h2>Join the Queue</h2>
            <label for="name">Your Full Name</label>
            <input type="text" id="name" placeholder="Enter your name here..." autocomplete="off">
            <button onclick="submitName()">Submit</button>
            <p class="status" id="status-text"></p>
        </div>

        <div class="success" id="success-view">
            <h3>✅ Added to Queue!</h3>
            <p>Thank you. Please wait for your name to be called.</p>
            <br>
            <button onclick="goBack()">Submit Another</button>
        </div>
    </div>

    <script>
        // SAME database setup as queue.html
        const firebaseConfig = {
            apiKey: "AIzaSyCqZ9xZJTLw0bFhVgKqXz9YwPnDk8ZxM6s",
            authDomain: "magcoop-queue.firebaseapp.com",
            databaseURL: "https://magcoop-queue-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "magcoop-queue",
            storageBucket: "magcoop-queue.appspot.com",
            messagingSenderId: "555123456789",
            appId: "1:555123456789:web:abc123def456ghi789jkl01"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const queueRef = db.ref('queue');

        function submitName() {
            const name = document.getElementById('name').value.trim();
            if (!name) { alert('Please enter your name'); return; }

            document.getElementById('status-text').textContent = "⏳ Sending...";
            
            // Add to cloud database — auto-sorts by time
            queueRef.push(name).then(() => {
                document.getElementById('form-view').style.display = 'none';
                document.getElementById('success-view').style.display = 'block';
            }).catch(err => {
                alert("Error: Check internet connection.");
                document.getElementById('status-text').textContent = "❌ Failed";
            });
        }

        function goBack() {
            document.getElementById('form-view').style.display = 'block';
            document.getElementById('success-view').style.display = 'none';
            document.getElementById('name').value = '';
            document.getElementById('status-text').textContent = "";
        }
    </script>
</body>
</html>
